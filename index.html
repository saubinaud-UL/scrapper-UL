<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sist. Aprobación de Precios - UnaLuka</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
        <img src="logo.svg" alt="UnaLuka Logo" class="logo">
        <div class="header-stats">
            <div class="stat-item">
                <span class="stat-label">Pendientes de Aprobar</span>
                <span class="stat-value" id="pending-count">Cargando...</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Última Carga</span>
                <span class="stat-value" id="last-update">--</span>
            </div>
        </div>
    </header>

    <div class="container">
        <div class="grid" id="product-grid">
            <!-- Cards will be rendered dynamically by app.js -->
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
